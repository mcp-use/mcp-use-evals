name: Weekly SDK experience
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated task ids (empty = all compatible tasks)
        default: ''
        type: string
      attempts:
        description: Independent attempts per task
        default: '3'
        type: string
      sdk-package:
        description: npm SDK package
        default: mcp-use
        type: string
      sdk-name:
        description: SDK display name (defaults to package name)
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: weekly-sdk-history
  cancel-in-progress: false
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # Append run evidence and reports to eval-history only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.11'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Restore durable history
        id: history
        run: |
          if git ls-remote --exit-code origin refs/heads/eval-history > /dev/null; then
            git fetch origin refs/heads/eval-history:refs/remotes/origin/eval-history
            git archive FETCH_HEAD history | tar -x
          else
            status=$?
            [ "$status" = 2 ] || exit "$status"
            mkdir -p history
          fi
      - name: Harness checks
        id: checks
        continue-on-error: true
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          uv run ruff check mcp_use_evals tests_python
          uv run pytest
      - name: Run agent attempts and per-trial analysis
        id: eval
        uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          tasks: ${{ inputs.tasks }}
          attempts: ${{ inputs.attempts || '3' }}
          sdk-package: ${{ inputs.sdk-package || 'mcp-use' }}
          sdk-name: ${{ inputs.sdk-name }}
      - name: Archive complete or partial runs
        if: always()
        run: |
          for manifest in jobs/*/manifest.json; do
            [ -f "$manifest" ] || continue
            uv run evals archive "$(dirname "$manifest")"
          done
      - name: Record workflow coverage
        if: always()
        env:
          CHECK_STATUS: ${{ steps.checks.outcome }}
          EVAL_STATUS: ${{ steps.eval.outcome }}
        run: |
          uv run python - <<'PYTHON'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          events = Path('history/events')
          events.mkdir(parents=True, exist_ok=True)
          identity = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          (events / (identity + '.json')).write_text(json.dumps({
              'created_at': datetime.now(timezone.utc).isoformat(),
              'checks': os.environ['CHECK_STATUS'], 'eval': os.environ['EVAL_STATUS'],
              'source_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
          }, indent=2))
          PYTHON
      - name: Synthesize the reporting week
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run evals synthesize --days 7
      - name: Persist history
        if: always() && steps.history.outcome == 'success'
        run: |
          [ -d history ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/eval-history-index"
          git read-tree --empty
          git add -f history
          tree=$(git write-tree)
          parent=()
          if git show-ref --verify --quiet refs/remotes/origin/eval-history; then
            parent=(-p refs/remotes/origin/eval-history)
          fi
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "Weekly evidence: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT")
          git push origin "$commit:refs/heads/eval-history"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-experience
          path: |
            jobs/
            history/reports/
          retention-days: 90
      - name: Surface harness failures after collecting evidence
        if: always() && steps.checks.outcome == 'failure'
        run: exit 1
