name: Evals
on:
  schedule:
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated task ids (empty = all)
        type: string
        default: ''
      attempts:
        description: Independent attempts per task
        type: string
        default: '3'
      min-pass-rate:
        description: Required pass rate (0–100); infrastructure errors always fail
        type: string
        default: '80'
permissions:
  contents: read
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.11'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Validate task selection and build matrix
        id: tasks
        env:
          REQUESTED_TASKS: ${{ inputs.tasks }}
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          available = sorted(p.parent.name for p in Path('tasks').glob('*/task.json'))
          requested = [t.strip() for t in os.environ['REQUESTED_TASKS'].split(',') if t.strip()]
          unknown = set(requested) - set(available)
          if unknown:
              raise SystemExit(f'Unknown tasks: {sorted(unknown)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tasks=' + json.dumps(sorted(set(requested or available))) + '\n')
          PY
      - name: Validate every golden solution before spending agent budget
        run: uv run evals verify --job-name oracle --concurrency 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle
          path: jobs/
          retention-days: 30
  eval:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: ${{ fromJSON(needs.verify.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: eval
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          tasks: ${{ matrix.task }}
          attempts: ${{ inputs.attempts || '3' }}
          concurrency: '2'
          # Apply the batch threshold once, after all shards are gathered.
          min-pass-rate: '0'
          verify: 'false'
          job-name: ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.task }}
          path: jobs/
          retention-days: 90
  report:
    needs: [verify, eval]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: jobs
          merge-multiple: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.11'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Publish batch scorecard and enforce threshold
        env:
          EXPECTED_TASKS: ${{ needs.verify.outputs.tasks }}
          MIN_PASS_RATE: ${{ inputs.min-pass-rate || '80' }}
          EVAL_STATUS: ${{ needs.eval.result }}
        run: uv run python -m mcp_use_evals.batch jobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-report
          path: jobs/batch-report.md
          retention-days: 90
