name: Readiness evals

# Manual trigger only — each run boots Docker sandboxes and calls paid LLM APIs,
# so we never run this automatically.
#
# Inputs (Actions → Readiness evals → Run workflow):
#   variants  free-text. "all" = the full 8-variant matrix, or a comma/space-
#             separated subset of variant names (e.g. "blank-cc, skill-cc").
#             Unknown names fail the prepare job fast. One name = one cheap job.
#   evals     free-text. "all" = every scenario, or a comma/space-separated list
#             of scenario names, or a glob (e.g. "oauth-*" / "stormdesk-*").
#             Passed to the harness as EVAL_FILTER; defineExperiment turns it
#             into config.evals (the CLI has no scenario-filter flag).
#   smoke     1 scenario per variant (cheap end-to-end check of keys + sandbox).
#   force     ignore run fingerprints and re-run everything.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants: "all" or a comma/space list (e.g. "blank-cc, skill-cc")'
        type: string
        default: all
      evals:
        description: 'Scenarios: "all", a glob ("oauth-*"), or a comma/space list'
        type: string
        default: all
      smoke:
        description: 'Smoke test: 1 scenario per variant (cheap end-to-end check)'
        type: boolean
        default: false
      force:
        description: 'Ignore run fingerprints and re-run everything'
        type: boolean
        default: false

# Queue overlapping dispatches rather than cancelling an in-flight (expensive) run.
concurrency:
  group: readiness-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Expand the chosen variant(s) into a matrix the run job fans out over.
  # "all" → every variant; otherwise split the free-text input on commas/spaces,
  # validate each name against the known set, and build the matrix JSON with jq.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    env:
      VARIANTS_INPUT: ${{ inputs.variants }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          known='["blank-cc","blank-codex","scaffold-cc","scaffold-codex","skill-cc","skill-codex","skill+scaffold-cc","skill+scaffold-codex"]'

          if [ "$(echo "$VARIANTS_INPUT" | tr '[:upper:]' '[:lower:]' | xargs)" = "all" ]; then
            variants="$known"
          else
            # Split on commas/spaces, trim blanks, dedupe (keeping order), JSON-encode.
            variants=$(echo "$VARIANTS_INPUT" \
              | tr ',' ' ' \
              | xargs -n1 \
              | awk 'NF && !seen[$0]++' \
              | jq -R . | jq -s -c .)

            if [ "$(echo "$variants" | jq 'length')" -eq 0 ]; then
              echo "::error::No variants parsed from input: '$VARIANTS_INPUT'"
              exit 1
            fi

            # Reject any name not in the known set. Build the human-readable
            # lists first (a separate jq call), so the error echoes contain no
            # nested command substitution — bash mis-tokenizes the comma in
            # jq's join(", ") when it sits inside $(...) in an echo.
            unknown=$(jq -n -c --argjson got "$variants" --argjson known "$known" '$got - $known')
            unknown_list=$(echo "$unknown" | jq -r 'join(", ")')
            known_list=$(echo "$known" | jq -r 'join(", ")')
            if [ "$(echo "$unknown" | jq 'length')" -ne 0 ]; then
              echo "::error::Unknown variant(s): $unknown_list"
              echo "::error::Valid variants: $known_list"
              exit 1
            fi
          fi

          echo "Selected variants: $variants"
          echo "matrix={\"variant\":$variants}" >> "$GITHUB_OUTPUT"

  # One job per variant. Each runs every scenario in the local Docker sandbox.
  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false # a failing variant must not abort the others
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # scorecard + experiments rely on native TS type-stripping
          cache: npm

      - run: npm ci

      # GitHub-hosted ubuntu runners ship Docker; the harness uses the local
      # daemon (sandbox: 'docker'), so no Vercel token is needed.
      - name: Verify Docker
        run: docker info

      - name: Run evals (${{ matrix.variant }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # cc variants + LLM judge
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # codex variants
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }} # optional gateway routing
          # Scenario filter. defineExperiment reads EVAL_FILTER and sets config.evals
          # ("all"/empty → every scenario). The CLI has no scenario-filter flag, so
          # this env var is the supported hook. An unknown name fails here at run time.
          EVAL_FILTER: ${{ inputs.evals }}
        run: |
          FLAGS=""
          [ "${{ inputs.smoke }}" = "true" ] && FLAGS="$FLAGS --smoke"
          [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          npx agent-eval "${{ matrix.variant }}" $FLAGS

      - name: Upload results
        if: always() # keep partial artifacts even when a run fails
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.variant }}
          path: results/
          if-no-files-found: warn

  # Pull every variant's results back together and roll up the scorecard.
  scorecard:
    needs: [prepare, run]
    if: always() # aggregate whatever results exist, even if some variants failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true # reconstruct the results/<variant>/... tree

      - name: Aggregate scorecard
        run: npm run scorecard | tee scorecard.txt

      - name: Publish scorecard to job summary
        if: always()
        run: |
          {
            echo '## Readiness scorecard'
            echo '```'
            cat scorecard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results + scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: |
            results/
            scorecard.txt
          if-no-files-found: warn
