name: Harness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.11'
          python-version: '3.12'
      - run: uv sync --locked
      - run: pnpm typecheck && pnpm test
      - run: uv run ruff check mcp_use_evals tests_python && uv run pytest
      - name: Oracle integration test (no API secrets)
        run: uv run evals verify --concurrency 2 --job-name oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-integration
          path: jobs/
