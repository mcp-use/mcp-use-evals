name: mcp-use Harbor evals
description: Run MCP task contracts with Harbor and generate native agent analysis.
inputs:
  openai-api-key:
    description: OpenAI key for the Codex baseline and analysis agent
    required: true
  config:
    description: Native Harbor job config, relative to this action's checkout
    default: configs/baseline.yaml
  tasks:
    description: Comma-separated task ids; empty runs every task
    default: ''
  attempts:
    description: Independent attempts per task
    default: '3'
  concurrency:
    description: Maximum simultaneous trial containers
    default: '3'
  min-pass-rate:
    description: Required percentage of valid runtime trials passing
    default: '0'
  analyze:
    description: Generate Harbor's agentic analysis after execution
    default: 'true'
  sdk-package:
    description: npm SDK package requested in portable task prompts
    default: mcp-use
  sdk-name:
    description: SDK display name (defaults to package name)
    default: ''
  job-name:
    description: Unique job name; empty generates one
    default: ''
outputs:
  run-dir:
    description: Absolute path to the Harbor job and reports
    value: ${{ steps.eval.outputs.run-dir }}
  report:
    description: Deterministic Markdown scorecard
    value: ${{ steps.eval.outputs.report }}
  pass-rate:
    description: Percentage of valid runtime trials passing, or null when unscorable
    value: ${{ steps.eval.outputs.pass-rate }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.11'
        python-version: '3.12'
    - name: Install pinned Harbor SDK
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync --locked
    - name: Run and analyze
      id: eval
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        IN_SDK_PACKAGE: ${{ inputs.sdk-package }}
        IN_SDK_NAME: ${{ inputs.sdk-name }}
        IN_CONFIG: ${{ inputs.config }}
        IN_TASKS: ${{ inputs.tasks }}
        IN_ATTEMPTS: ${{ inputs.attempts }}
        IN_CONCURRENCY: ${{ inputs.concurrency }}
        IN_MIN_PASS_RATE: ${{ inputs.min-pass-rate }}
        IN_ANALYZE: ${{ inputs.analyze }}
        IN_JOB_NAME: ${{ inputs.job-name }}
      run: |
        set -euo pipefail
        : "${OPENAI_API_KEY:?Set the openai-api-key input}"
        args=(run --sdk-package "$IN_SDK_PACKAGE" --sdk-name "$IN_SDK_NAME" --config "$IN_CONFIG" --attempts "$IN_ATTEMPTS"
          --concurrency "$IN_CONCURRENCY" --min-pass-rate "$IN_MIN_PASS_RATE")
        IFS=',' read -ra tasks <<< "$IN_TASKS"
        for task in "${tasks[@]}"; do
          task="${task#"${task%%[![:space:]]*}"}"
          task="${task%"${task##*[![:space:]]}"}"
          [ -z "$task" ] || args+=(--task "$task")
        done
        [ -z "$IN_JOB_NAME" ] || args+=(--job-name "$IN_JOB_NAME")
        [ "$IN_ANALYZE" = true ] || args+=(--no-analyze)
        uv run --locked evals "${args[@]}"
